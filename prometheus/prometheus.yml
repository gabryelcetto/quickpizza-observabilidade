global:
  scrape_interval: 15s      # coleta a cada 15 segundos

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: cadvisor       # CPU, memória, rede e estado dos containers
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: quickpizza     # métricas da própria aplicação
    metrics_path: /metrics
    static_configs:
      - targets: ["quickpizza:3333"]
